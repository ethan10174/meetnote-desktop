name: Build and Sign Mac DMG

on:
  push:
    branches: [main]

jobs:
  build-mac:
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Write API key
        run: |
          echo '${{ secrets.APPLE_API_KEY }}' > /tmp/AuthKey.p8
          echo 'APPLE_API_KEY=/tmp/AuthKey.p8' >> $GITHUB_ENV

      - name: Import certificate
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)
          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          echo "${{ secrets.CSC_LINK }}" | base64 --decode > /tmp/certificate.p12
          security import /tmp/certificate.p12 -k $KEYCHAIN_PATH -P "${{ secrets.CSC_KEY_PASSWORD }}" -T /usr/bin/codesign
          security list-keychain -d user -s $KEYCHAIN_PATH
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> $GITHUB_ENV

      - name: Build unsigned app
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run dist

      - name: Code sign app
        run: |
          APP_PATH=$(find dist -maxdepth 3 -name "*.app" | head -1)
          echo "APP_PATH=$APP_PATH" >> $GITHUB_ENV
          codesign --force --deep --options runtime --timestamp \
            --entitlements entitlements.mac.plist \
            --sign "ETHAN ALLISON (GMVTGR644V)" \
            --keychain "$KEYCHAIN_PATH" \
            "$APP_PATH"
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"

      - name: Create DMG
        run: |
          DMG_SRC=dist/dmg-src
          mkdir -p "$DMG_SRC"
          cp -R "$APP_PATH" "$DMG_SRC/"
          ln -s /Applications "$DMG_SRC/Applications"
          hdiutil create -volname "MeetNote" -srcfolder "$DMG_SRC" -ov -format UDZO dist/MeetNote.dmg

      - name: Notarize DMG
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          xcrun notarytool submit dist/MeetNote.dmg \
            --key "$APPLE_API_KEY" \
            --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_ISSUER" \
            --wait
          xcrun stapler staple dist/MeetNote.dmg

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: MeetNote-mac-dmg
          path: dist/*.dmg
          if-no-files-found: error
          retention-days: 30

  build-windows:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Build Windows installer
        run: npx electron-builder --win --publish never

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: MeetNote-windows-installer
          path: dist/*.exe
          if-no-files-found: error
          retention-days: 30
